spring:
  application:
    name: product-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:productdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:ZestIndia2024SecretKeyForJWTTokenSigningMustBeAtLeast256BitsLong!}
  access-token-expiration: ${JWT_ACCESS_EXPIRY:900000}       # 15 minutes
  refresh-token-expiration: ${JWT_REFRESH_EXPIRY:604800000}  # 7 days

# ── Server ─────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}

# ── Swagger ────────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    try-it-out-enabled: true

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    com.zest.productapi: DEBUG
    org.springframework.security: WARN
