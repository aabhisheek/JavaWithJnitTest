name: CI – Build, Test & Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Test & Coverage ──────────────────────────────────────────────────────────
  test:
    name: Test (Java 17 + H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests & enforce 70% line coverage
        run: mvn verify -B -Dspring.profiles.active=test

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  # ── Docker build (only on main) ───────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false          # set to true and add login step when deploying to a registry
          tags: product-api:${{ github.sha }},product-api:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
